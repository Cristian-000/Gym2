<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Gym</title>
    
    <!-- PWA: Manifiesto y Color de Tema -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <!-- Iconos para Apple (opcional pero recomendado) -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- Controles Superiores -->
        <div class="top-controls">
            <nav class="tabs" id="tabs-container"></nav>
            <button id="edit-btn" class="action-btn">Editar</button>
        </div>

        <!-- Contenedor Principal de Rutina -->
        <main id="content-container"></main>

        <!-- Panel de Edición Visual (Oculto por defecto) -->
        <div id="editor-container" class="hidden">
            <h2>Modo Edición</h2>
            <div id="visual-editor-content"></div>
            
            <div class="editor-actions">
                <button id="save-json-btn" class="action-btn success">Guardar Cambios</button>
                <button id="cancel-edit-btn" class="action-btn">Cancelar</button>
                <button id="reset-json-btn" class="action-btn danger">Restaurar Original</button>
            </div>
            <p id="editor-msg" class="msg"></p>
        </div>

        <!-- Cronómetro Flotante -->
        <div id="stopwatch-container">
            <div id="display">00:00</div>
            <div class="sw-controls">
                <button id="start-btn">▶</button>
                <button id="pause-btn">⏸</button>
                <button id="reset-btn">⏹</button>
            </div>
        </div>

    </div>

    <!-- PWA: Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Fallo en el registro del ServiceWorker:', error);
                    });
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
